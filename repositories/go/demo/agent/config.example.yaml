service:
  defaults:
    provider: default
    protocol: chat_completions
    model: "" # 未指定模型时使用；此处也为空则需要选择模型
  loop:
    max_steps: 10

providers:
  default:
    base_url: "" # 供应商 API 基础地址，包含所需的版本路径
    api_key: ""
    headers: {}
    protocols:
      - chat_completions
    model_source: remote # 默认为 remote，动态获取模型列表；manual 使用下方列表
    models: [] # 仅在 manual 模式生效，空列表表示没有可选模型
